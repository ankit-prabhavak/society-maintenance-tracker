trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  AWS_REGION: 'ap-south-2'
  IMAGE_TAG: '$(Build.SourceVersion)'

stages:

  # ============================================================
  # STAGE 1: VALIDATE APPLICATION
  # ============================================================

  - stage: Validate
    displayName: Validate Application

    jobs:

      - job: Backend
        displayName: Backend Validation

        steps:
          - checkout: self

          - task: NodeTool@0
            displayName: Setup Node.js
            inputs:
              versionSpec: '18.x'

          - script: |
              cd backend
              npm ci
              node -c server.js
            displayName: Install and check backend


      - job: Frontend
        displayName: Frontend Validation

        steps:
          - checkout: self

          - task: NodeTool@0
            displayName: Setup Node.js
            inputs:
              versionSpec: '18.x'

          - script: |
              cd frontend
              npm ci
              CI=true npm run build
            displayName: Install and build frontend


  # ============================================================
  # STAGE 2: BUILD DOCKER IMAGES AND PUSH TO ECR
  # ============================================================

  - stage: DockerAndPush
    displayName: Build and Push Images

    dependsOn: Validate

    jobs:

      - job: BuildAndPush
        displayName: Build and Push to Amazon ECR

        steps:
          - checkout: self

          # -----------------------------
          # Build Docker images
          # -----------------------------

          - script: |
              docker build \
                -t society-maintenance-backend:$(IMAGE_TAG) \
                ./backend

              docker build \
                -t society-maintenance-frontend:$(IMAGE_TAG) \
                ./frontend
            displayName: Build Docker images


          # -----------------------------
          # Verify Docker images
          # -----------------------------

          - script: |
              docker images society-maintenance-backend
              docker images society-maintenance-frontend
            displayName: Verify Docker images


          # -----------------------------
          # Push Backend → ECR
          # -----------------------------

          - task: AWSECRPushImage@1
            displayName: Push Backend Image to ECR
            inputs:
              awsCredentials: 'AWS-ECR'
              regionName: '$(AWS_REGION)'
              sourceImageName: 'society-maintenance-backend'
              sourceImageTag: '$(IMAGE_TAG)'
              repositoryName: 'society-maintenance-backend'
              pushTag: '$(IMAGE_TAG)'


          # -----------------------------
          # Push Frontend → ECR
          # -----------------------------

          - task: AWSECRPushImage@1
            displayName: Push Frontend Image to ECR
            inputs:
              awsCredentials: 'AWS-ECR'
              regionName: '$(AWS_REGION)'
              sourceImageName: 'society-maintenance-frontend'
              sourceImageTag: '$(IMAGE_TAG)'
              repositoryName: 'society-maintenance-frontend'
              pushTag: '$(IMAGE_TAG)'