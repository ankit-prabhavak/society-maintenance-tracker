trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  AWS_REGION: 'ap-south-2'
  IMAGE_TAG: '$(Build.SourceVersion)'

stages:

  # ============================================================
  # STAGE 1: VALIDATE APPLICATION
  # ============================================================

  - stage: Validate
    displayName: Validate Application

    jobs:

      - job: Backend
        displayName: Backend Validation

        steps:
          - checkout: self

          - task: NodeTool@0
            displayName: Setup Node.js
            inputs:
              versionSpec: '18.x'

          - script: |
              cd backend
              npm ci
              node -c server.js
            displayName: Install and check backend


      - job: Frontend
        displayName: Frontend Validation

        steps:
          - checkout: self

          - task: NodeTool@0
            displayName: Setup Node.js
            inputs:
              versionSpec: '18.x'

          - script: |
              cd frontend
              npm ci
              CI=true npm run build
            displayName: Install and build frontend


  # ============================================================
  # STAGE 2: BUILD DOCKER IMAGES AND PUSH TO ECR
  # ============================================================

  - stage: DockerAndPush
    displayName: Build and Push Images

    dependsOn: Validate

    jobs:
      - job: BuildAndPush
        displayName: Build and Push to Amazon ECR

        steps:
          - checkout: self

          - script: |
              docker build -t society-maintenance-backend:$(IMAGE_TAG) ./backend
              docker build -t society-maintenance-frontend:$(IMAGE_TAG) ./frontend
            displayName: Build Docker images

          - task: AWSShellScript@1
            displayName: Login and Push Images to ECR
            inputs:
              awsCredentials: 'AWS-ECR'
              regionName: '$(AWS_REGION)'
              scriptType: 'inline'
              inlineScript: |
                ACCOUNT_ID=625552167867
                REGION=$(AWS_REGION)

                ECR_REGISTRY=$ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com

                aws ecr get-login-password --region $REGION | \
                  docker login --username AWS --password-stdin $ECR_REGISTRY

                docker tag society-maintenance-backend:$(IMAGE_TAG) \
                  $ECR_REGISTRY/society-maintenance-backend:$(IMAGE_TAG)

                docker tag society-maintenance-frontend:$(IMAGE_TAG) \
                  $ECR_REGISTRY/society-maintenance-frontend:$(IMAGE_TAG)

                docker push \
                  $ECR_REGISTRY/society-maintenance-backend:$(IMAGE_TAG)

                docker push \
                  $ECR_REGISTRY/society-maintenance-frontend:$(IMAGE_TAG)