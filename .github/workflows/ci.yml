name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: node -c server.js

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: CI=true npm run build

  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t society-maintenance-backend:${{ github.sha }} ./backend

      - name: Build frontend image
        run: docker build -t society-maintenance-frontend:${{ github.sha }} ./frontend

      - name: Verify Docker images
        run: |
          docker images society-maintenance-backend
          docker images society-maintenance-frontend

  publish:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docker

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::625552167867:role/GitHubActionsECRRole
          aws-region: ap-south-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend image
        run: docker build -t ${{ steps.login-ecr.outputs.registry }}/society-maintenance-backend:${{ github.sha }} ./backend

      - name: Build frontend image
        run: docker build -t ${{ steps.login-ecr.outputs.registry }}/society-maintenance-frontend:${{ github.sha }} ./frontend

      - name: Push backend image
        run: docker push ${{ steps.login-ecr.outputs.registry }}/society-maintenance-backend:${{ github.sha }}

      - name: Push frontend image
        run: docker push ${{ steps.login-ecr.outputs.registry }}/society-maintenance-frontend:${{ github.sha }}